# Manual: deletes the named releases and their tags (sessions and scripts that cannot
# delete releases directly run this instead).
name: Delete releases

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Release tags to delete, space separated
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAGS: ${{ inputs.tags }}
        run: |
          for t in $TAGS; do gh release delete "$t" --yes --cleanup-tag; done
          gh release list
