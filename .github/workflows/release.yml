# Manual release: builds agent8 for each Jenkins version, tests it like CI does and
# publishes one GitHub Release per Jenkins version, tagged jenkins-<version>. The latest
# release carries index.txt ("<remoting version> <tag>" per line), which install.sh uses
# to find the release that matches a controller's remoting version.
name: Release

on:
  workflow_dispatch:
    inputs:
      jenkins:
        description: Jenkins image tags, space separated (e.g. "lts-jdk21 latest-jdk21 2.541.3-lts-jdk21"); "none" to release only the basic ones
        default: lts-jdk21 latest-jdk21
      basic:
        description: Older Jenkins image tags whose plugins no longer install, tested with a bare controller (freestyle shell build), e.g. "2.462.3-lts-jdk17"
        default: ''
      latest:
        description: The release built from this tag becomes "latest", install.sh's fallback
        default: lts-jdk21
      dry_run:
        description: Build and test only, publish nothing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      jenkins: ${{ steps.list.outputs.jenkins }}
    steps:
      - id: list
        env:
          JENKINS: ${{ inputs.jenkins }}
          BASIC: ${{ inputs.basic }}
        run: |
          {
            for t in $JENKINS; do [ "$t" = none ] && continue; jq -nc --arg t "$t" '{tag: $t, basic: ""}'; done
            for t in $BASIC; do jq -nc --arg t "$t" '{tag: $t, basic: "1"}'; done
          } | jq -sc . | sed 's/^/jenkins=/' >> "$GITHUB_OUTPUT"

  release:
    name: Jenkins ${{ matrix.jenkins.tag }}${{ matrix.jenkins.basic && ' (bare controller)' || '' }}
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signed build-provenance and SBOM attestations (Sigstore, via GitHub).
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 1  # two Jenkins versions can share a remoting version, so one release
      matrix:
        jenkins: ${{ fromJSON(needs.versions.outputs.jenkins) }}
    env:
      BASIC: ${{ matrix.jenkins.basic }}
      # Dispatch inputs: used in scripts only through the environment.
      JENKINS_TAG: ${{ matrix.jenkins.tag }}
      LATEST: ${{ inputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Start controller
        run: |
          if [ -n "$BASIC" ]; then plugins=(--build-arg PLUGINS=); else plugins=(); fi
          docker build --progress=plain -t controller --build-arg "JENKINS_TAG=$JENKINS_TAG" "${plugins[@]}" -f test/Dockerfile.controller test
          docker run -d --name controller --network host controller
          for i in $(seq 1 60); do curl -fs -o /dev/null localhost:8080/login && break; sleep 3; done
          curl -fsS -o agent.jar localhost:8080/jnlpJars/agent.jar
          echo "JENKINS_VERSION=$(curl -fsSI localhost:8080/login | sed -n 's/^X-Jenkins: *//Ip' | tr -d '\r')" >> "$GITHUB_ENV"

      - name: Build agent8-java8.jar, agent8-java11.jar and agent8-java17.jar
        run: AGENT8_VERSION=jenkins-$JENKINS_VERSION ./build.sh agent.jar 8 11 17

      - name: Test HotSpot 8 on CentOS 6
        run: |
          JDK8_IMAGE=eclipse-temurin:8-jdk test/serialization.sh
          JDK8_IMAGE=eclipse-temurin:8-jdk AGENT_IMAGE=centos:6 test/it.sh

      - name: Test OpenJ9 8
        run: |
          JDK8_IMAGE=ibm-semeru-runtimes:open-8-jdk test/serialization.sh
          JDK8_IMAGE=ibm-semeru-runtimes:open-8-jdk AGENT_IMAGE=ibm-semeru-runtimes:open-8-jdk test/it.sh

      - name: Test HotSpot 11
        env:
          JDK8_IMAGE: eclipse-temurin:11-jdk
          AGENT_IMAGE: eclipse-temurin:11-jdk
          AGENT_JAR: agent8-java11.jar
          EXPECT_JAVA: '11'
          EXPECT_JAR: agent8-java11.jar
        run: test/serialization.sh && test/it.sh

      - name: Test HotSpot 17
        env:
          JDK8_IMAGE: eclipse-temurin:17-jdk
          AGENT_IMAGE: eclipse-temurin:17-jdk
          AGENT_JAR: agent8-java17.jar
          EXPECT_JAVA: '17'
          EXPECT_JAR: agent8-java17.jar
        run: test/serialization.sh && test/it.sh

      - name: Controller log
        if: failure()
        run: docker logs controller 2>&1 | tail -200

      - name: Checksums
        run: cd dist && sha256sum *.jar *.cdx.json > sha256sums.txt && cat sha256sums.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: agent8-jenkins-${{ env.JENKINS_VERSION }}
          path: dist/

      # Anyone can check a jar came unmodified from this workflow:
      #   gh attestation verify agent8-java8.jar --repo keelinfra/agent8
      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: dist/*.jar

      - name: Attest SBOM (Java 8)
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: dist/agent8-java8.jar
          sbom-path: dist/agent8-java8.cdx.json

      - name: Attest SBOM (Java 11)
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: dist/agent8-java11.jar
          sbom-path: dist/agent8-java11.cdx.json

      - name: Attest SBOM (Java 17)
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: dist/agent8-java17.jar
          sbom-path: dist/agent8-java17.cdx.json

      - name: Publish release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(unzip -p dist/agent8-java8.jar META-INF/MANIFEST.MF | sed -n 's/^Agent8-Remoting-Version: *//p' | tr -d '\r')
          tag=jenkins-$JENKINS_VERSION
          if [ -n "$BASIC" ]; then tested="Tested with Jenkins $JENKINS_VERSION: connect, freestyle shell build, artifacts; no Pipeline or plugin tests"
          else tested="Tested with Jenkins $JENKINS_VERSION"; fi
          title="agent8 for Jenkins $JENKINS_VERSION"
          notes="agent8 for Jenkins $JENKINS_VERSION. Jenkins $JENKINS_VERSION ships remoting $V; this release also works with any other Jenkins version that ships remoting $V, and \`install.sh --url\` finds it for you. $tested, built from ${GITHUB_SHA::7}.

          | Host Java | Jar |
          |---|---|
          | 8 and newer | agent8-java8.jar |
          | 11 and newer | agent8-java11.jar |
          | 17 and newer | agent8-java17.jar |

          Install: \`sh install.sh --url <controller>\` picks the right jar, see the README.
          jvmdg.jar is JvmDowngrader 2.0.1, unmodified, LGPL-2.1. Checksums: sha256sums.txt. SBOM (CycloneDX): agent8-javaN.cdx.json, one per jar.

          Check a jar came unmodified from this repository's release workflow: \`gh attestation verify agent8-java8.jar --repo $GITHUB_REPOSITORY\`. Security support: [SECURITY.md](https://github.com/$GITHUB_REPOSITORY/blob/main/SECURITY.md)."
          # The tag marks the commit this release was built from.
          git tag -f "$tag" && git push -f origin "refs/tags/$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.jar dist/*.cdx.json dist/sha256sums.txt --clobber
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" dist/*.jar dist/*.cdx.json dist/sha256sums.txt --title "$title" --notes "$notes" --latest=false
          fi
          if [ "$JENKINS_TAG" = "$LATEST" ]; then gh release edit "$tag" --latest; fi
          # index.txt on the latest release: newest release first for each remoting version.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | select(.tag_name | startswith("jenkins-")) | (.body | capture("ships remoting (?<v>[^ ;,]+)").v) + " " + .tag_name' \
            > index.txt
          cat index.txt
          gh release upload "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" index.txt --clobber

      - name: Install from the published release
        if: ${{ !inputs.dry_run }}
        run: |
          docker run --rm --network host -v "$PWD/install.sh:/install.sh:ro" eclipse-temurin:8-jdk \
            sh /install.sh --url http://localhost:8080/ --dir /tmp/agent8 --repo https://github.com/${{ github.repository }}
