name: CI

# Docs-only changes (README, docs/, other Markdown) do not run the build; the weekly run
# and any code change still do.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  schedule:
    # Weekly: catch new Jenkins and remoting releases early.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Installer and playbook syntax
        run: |
          sh -n install.sh
          shellcheck -s sh install.sh
          pipx run --spec ansible-core ansible-playbook --syntax-check -i localhost, ansible/agent8.yml

  build:
    name: Jenkins ${{ matrix.jenkins }}, ${{ matrix.agent.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jenkins: [lts-jdk21, latest-jdk21]
        agent:
          - name: HotSpot 8 on CentOS 6
            jdk: eclipse-temurin:8-jdk
            os: centos:6
          - name: OpenJ9 8
            jdk: ibm-semeru-runtimes:open-8-jdk
            os: ibm-semeru-runtimes:open-8-jdk
          # Java 11 and 17 builds (for hosts capped at 11, such as Solaris, or at 17): on LTS only.
          - name: HotSpot 11
            jdk: eclipse-temurin:11-jdk
            os: eclipse-temurin:11-jdk
            java: '11'
            jar: agent8-java11.jar
          - name: HotSpot 17
            jdk: eclipse-temurin:17-jdk
            os: eclipse-temurin:17-jdk
            java: '17'
            jar: agent8-java17.jar
        # Controllers on other Java versions: Java 25 (current LTS), Java 17 (2.541.3, the
        # last LTS that runs on 17) and Java 11 (2.462.3). The agent side is the same; only the old-Java agents.
        include:
          - jenkins: lts-jdk25
            agent: {name: HotSpot 8 on CentOS 6, jdk: eclipse-temurin:8-jdk, os: centos:6}
          - jenkins: lts-jdk25
            agent: {name: OpenJ9 8, jdk: ibm-semeru-runtimes:open-8-jdk, os: ibm-semeru-runtimes:open-8-jdk}
          - jenkins: 2.541.3-lts-jdk17
            agent: {name: HotSpot 8 on CentOS 6, jdk: eclipse-temurin:8-jdk, os: centos:6}
          # Java 11: 2.462.3, the last LTS that runs on 11. Its plugins no longer install,
          # so it is tested with a bare controller (freestyle shell build), as releases are.
          - jenkins: 2.462.3-lts-jdk11
            basic: '1'
            agent: {name: HotSpot 8 on CentOS 6, jdk: eclipse-temurin:8-jdk, os: centos:6}
        exclude:
          - jenkins: latest-jdk21
            agent: {name: HotSpot 11, jdk: eclipse-temurin:11-jdk, os: eclipse-temurin:11-jdk, java: '11', jar: agent8-java11.jar}
          - jenkins: latest-jdk21
            agent: {name: HotSpot 17, jdk: eclipse-temurin:17-jdk, os: eclipse-temurin:17-jdk, java: '17', jar: agent8-java17.jar}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Start controller
        run: |
          if [ -n "${{ matrix.basic }}" ]; then plugins=(--build-arg PLUGINS=); else plugins=(); fi
          docker build --progress=plain -t controller --build-arg JENKINS_TAG=${{ matrix.jenkins }} "${plugins[@]}" -f test/Dockerfile.controller test
          docker run -d --name controller --network host controller
          for i in $(seq 1 60); do curl -fs -o /dev/null localhost:8080/login && break; sleep 3; done
          curl -fsS -o agent.jar localhost:8080/jnlpJars/agent.jar
          echo "JENKINS_VERSION=$(curl -fsSI localhost:8080/login | sed -n 's/^X-Jenkins: *//Ip' | tr -d '\r')" >> "$GITHUB_ENV"

      # agent8-java8.jar, agent8-java11.jar and agent8-java17.jar.
      - name: Build agent8 jars from the controller's agent.jar
        run: ./build.sh agent.jar 8 11 17

      - name: Serialization test
        run: test/serialization.sh
        env:
          JDK8_IMAGE: ${{ matrix.agent.jdk }}
          AGENT_JAR: ${{ matrix.agent.jar || 'agent8-java8.jar' }}

      - name: Integration test
        run: test/it.sh
        env:
          JDK8_IMAGE: ${{ matrix.agent.jdk }}
          AGENT_IMAGE: ${{ matrix.agent.os }}
          EXPECT_JAVA: ${{ matrix.agent.java || '1.8' }}
          EXPECT_JAR: ${{ matrix.agent.jar || 'agent8-java8.jar' }}
          BASIC: ${{ matrix.basic }}

      - name: Controller log
        if: failure()
        run: docker logs controller 2>&1 | tail -200

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        # Once per Jenkins version: lts-jdk25 is the same version as lts-jdk21.
        if: matrix.agent.name == 'HotSpot 8 on CentOS 6' && endsWith(matrix.jenkins, '-jdk21')
        with:
          name: agent8-jenkins-${{ env.JENKINS_VERSION }}
          path: dist/

      # Install from GitHub on CentOS 6, then again without curl/wget, which forces the
      # Java download path used when an old host's CA bundle cannot verify github.com.
      - name: Install from the latest release on CentOS 6
        if: matrix.agent.name == 'HotSpot 8 on CentOS 6'
        run: |
          docker create --name jdk8 eclipse-temurin:8-jdk >/dev/null
          docker cp jdk8:/opt/java/openjdk "$RUNNER_TEMP/jdk8"
          docker run --rm --network host -v "$PWD/install.sh:/install.sh:ro" -v "$RUNNER_TEMP/jdk8:/opt/jdk8:ro" centos:6 sh -c '
            set -e
            sh /install.sh --url http://localhost:8080/ --java /opt/jdk8/bin/java --dir /tmp/agent8 --repo https://github.com/${{ github.repository }}
            rm -f /usr/bin/curl /usr/bin/wget
            sh /install.sh --url http://localhost:8080/ --java /opt/jdk8/bin/java --dir /tmp/agent8-java --repo https://github.com/${{ github.repository }}'

  # The SSH Build Agents launcher, with Java Path set to the wrapper install.sh writes, on a
  # Java 8 host whose first security provider is a signed jar (as on Solaris).
  ssh:
    name: SSH Build Agents launcher, signed security provider, ${{ matrix.jdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # OpenJ9: the JVM family of IBM Java 8 on AIX, whose IBMJCE provider is signed.
        jdk: [eclipse-temurin:8-jdk, ibm-semeru-runtimes:open-8-jdk]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Start controller
        run: |
          docker build --progress=plain -t controller --build-arg JENKINS_TAG=lts-jdk21 --build-arg PLUGINS=ssh-slaves \
            -f test/Dockerfile.controller test
          docker run -d --name controller --network host controller
          for i in $(seq 1 60); do curl -fs -o /dev/null localhost:8080/login && break; sleep 3; done
          curl -fsS -o agent.jar localhost:8080/jnlpJars/agent.jar

      - name: Build agent8 from the controller's agent.jar
        run: ./build.sh agent.jar 8

      - name: SSH launcher test
        run: test/ssh.sh
        env:
          JDK8_IMAGE: ${{ matrix.jdk }}

      - name: Controller log
        if: failure()
        run: docker logs controller 2>&1 | tail -200

  # An older agent8 release against the newest controller, as after a controller upgrade
  # without rerunning install.sh, on a controller without the versioncolumn plugin (whose
  # Remoting Version monitor would take such an agent offline). Only the latest release
  # (current LTS): Jenkins refuses agents below a minimum remoting version, and 2.586
  # already refuses the jenkins-2.462.3 build (remoting 3248; "Agent version
  # 3256.3258.v858f3c9a_f69d or newer is required").
  version-skew:
    name: agent8 ${{ matrix.release }} against the weekly controller, no versioncolumn
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Start controller
        run: |
          docker build --progress=plain -t controller --build-arg JENKINS_TAG=latest-jdk21 \
            --build-arg PLUGINS="workflow-job workflow-cps workflow-durable-task-step workflow-basic-steps pipeline-stage-step junit git credentials-binding" \
            -f test/Dockerfile.controller test
          docker run -d --name controller --network host controller
          for i in $(seq 1 60); do curl -fs -o /dev/null localhost:8080/login && break; sleep 3; done

      - name: Download the release
        run: |
          mkdir dist
          for f in agent8-java8.jar jvmdg.jar sha256sums.txt; do
            if [ "${{ matrix.release }}" = latest ]; then base=latest/download; else base=download/${{ matrix.release }}; fi
            curl -fsSL -o "dist/$f" "https://github.com/${{ github.repository }}/releases/$base/$f"
          done
          curl -fsS -o controller-agent.jar localhost:8080/jnlpJars/agent.jar
          echo "controller remoting: $(unzip -p controller-agent.jar META-INF/MANIFEST.MF | sed -n 's/^Version: *//p')"
          echo "agent8 remoting:     $(unzip -p dist/agent8-java8.jar META-INF/MANIFEST.MF | sed -n 's/^Agent8-Remoting-Version: *//p')"

      - name: Integration test
        run: test/it.sh
        env:
          NO_VERSIONCOLUMN: '1'

      - name: Controller log
        if: failure()
        run: docker logs controller 2>&1 | tail -200
