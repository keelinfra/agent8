name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catch new Jenkins and remoting releases early.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Installer and playbook syntax
        run: |
          sh -n install.sh
          pipx run --spec ansible-core ansible-playbook --syntax-check -i localhost, ansible/agent8.yml

  build:
    name: Jenkins ${{ matrix.jenkins }}, ${{ matrix.agent.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publish releases
    strategy:
      fail-fast: false
      matrix:
        jenkins: [lts-jdk21, latest-jdk21]
        agent:
          - name: HotSpot 8 on CentOS 6
            jdk: eclipse-temurin:8-jdk
            os: centos:6
          - name: OpenJ9 8
            jdk: ibm-semeru-runtimes:open-8-jdk
            os: ibm-semeru-runtimes:open-8-jdk
          # Java 11 build (for hosts capped at 11, such as Solaris): smoke test on LTS only.
          - name: HotSpot 11
            jdk: eclipse-temurin:11-jdk
            os: eclipse-temurin:11-jdk
            java: '11'
            jar: agent8-java11.jar
        exclude:
          - jenkins: latest-jdk21
            agent: {name: HotSpot 11, jdk: eclipse-temurin:11-jdk, os: eclipse-temurin:11-jdk, java: '11', jar: agent8-java11.jar}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Start controller
        run: |
          docker build -q -t controller --build-arg JENKINS_TAG=${{ matrix.jenkins }} -f test/Dockerfile.controller test
          docker run -d --name controller --network host controller
          for i in $(seq 1 60); do curl -fs -o /dev/null localhost:8080/login && break; sleep 3; done
          curl -fsS -o agent.jar localhost:8080/jnlpJars/agent.jar
          echo "JENKINS_VERSION=$(curl -fsSI localhost:8080/login | sed -n 's/^X-Jenkins: *//Ip' | tr -d '\r')" >> "$GITHUB_ENV"

      # agent8.jar (Java 8), agent8-java11.jar and agent8-java17.jar; the Java 17 build
      # is only built, not tested yet.
      - name: Build agent8 jars from the controller's agent.jar
        run: ./build.sh agent.jar 8 11 17

      - name: Serialization test
        run: test/serialization.sh
        env:
          JDK8_IMAGE: ${{ matrix.agent.jdk }}
          AGENT_JAR: ${{ matrix.agent.jar || 'agent8.jar' }}

      - name: Integration test
        run: test/it.sh
        env:
          JDK8_IMAGE: ${{ matrix.agent.jdk }}
          AGENT_IMAGE: ${{ matrix.agent.os }}
          EXPECT_JAVA: ${{ matrix.agent.java || '1.8' }}
          EXPECT_JAR: ${{ matrix.agent.jar || 'agent8.jar' }}

      - name: Controller log
        if: failure()
        run: docker logs controller 2>&1 | tail -200

      - uses: actions/upload-artifact@v5
        if: matrix.agent.name == 'HotSpot 8 on CentOS 6'
        with:
          name: agent8-jenkins-${{ env.JENKINS_VERSION }}
          path: dist/

      # Releases are what install.sh downloads: one per remoting version, rebuilt
      # from main so fixes reach every supported version.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && matrix.agent.name == 'HotSpot 8 on CentOS 6'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(unzip -p dist/agent8.jar META-INF/MANIFEST.MF | sed -n 's/^Agent8-Remoting-Version: *//p' | tr -d '\r')
          tag=remoting-$V
          notes="agent8 for Jenkins remoting $V (tested with Jenkins $JENKINS_VERSION), built from ${GITHUB_SHA::7}.
          Install: \`sh install.sh --url <controller>\`, see the README.
          jvmdg.jar is JvmDowngrader 2.0.1, unmodified, LGPL-2.1."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.jar --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" dist/*.jar --title "agent8 for remoting $V" --notes "$notes" ||
              gh release upload "$tag" dist/*.jar --clobber
          fi
          # "latest" (install.sh's fallback) follows the LTS line.
          if [ "${{ matrix.jenkins }}" = lts-jdk21 ]; then gh release edit "$tag" --latest; fi

      - name: Install from the published release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && matrix.agent.name == 'HotSpot 8 on CentOS 6'
        run: |
          docker run --rm --network host -v "$PWD/install.sh:/install.sh:ro" ${{ matrix.agent.jdk }} \
            sh /install.sh --url http://localhost:8080/ --dir /tmp/agent8 --repo https://github.com/${{ github.repository }}
